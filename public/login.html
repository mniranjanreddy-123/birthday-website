<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>
</head>

<body>

    <h1>Admin Login</h1>

    <form action="/login" method="POST">

        <label for="password">Enter Admin Password:</label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">Login</button>

    </form>

</body>

</html>
