<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tell Me About You 💞</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .background {
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .background img {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }


        /* ========================= */
        /* WELCOME PAGE */
        /* ========================= */

        .welcome-intro {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background-color: pink;

            z-index: 100;

            animation: welcomeAppear 1.5s ease;
        }


        /* Cute Cat */

        .welcome-cat {
            font-size: 90px;

            animation: catBounce 1.5s infinite;
        }


        /* Welcome Heading */

        .welcome-intro h2 {
            margin: 15px 0 10px;

            font-size: 38px;

            color: white;

            text-shadow:
                0 0 10px white,
                0 0 20px hotpink;
        }


        /* Welcome Text */

        .welcome-intro p {
            margin: 0;

            font-size: 20px;

            color: white;

            line-height: 1.6;

            text-shadow: 0 0 8px hotpink;
        }


        /* Cat Bounce Animation */

        @keyframes catBounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }

        }


        /* Welcome Appearing Animation */

        @keyframes welcomeAppear {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* Welcome Disappearing Animation */

        .welcome-hide {
            animation: welcomeDisappear 1s ease forwards;
        }


        @keyframes welcomeDisappear {

            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(1.2);
                visibility: hidden;
            }

        }


        /* ========================= */
        /* Heading */
        /* ========================= */

        .background h1 {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);

            border: 3px solid rgb(37, 150, 198);
            border-radius: 25px;

            padding: 10px 20px;

            font-size: xx-large;
            color: rgb(18, 18, 219);

            text-align: center;
            white-space: nowrap;
        }


        /* ========================= */
        /* Form container */
        /* ========================= */

        .form {
            position: absolute;
            top: 170px;
            left: 50%;
            transform: translateX(-50%);

            width: 500px;
            max-width: 90%;

            background-color: rgba(255, 251, 251, 0.25);

            padding: 40px 50px;

            border-radius: 50px;
            border: 2px solid rgb(139, 20, 155);


            /* FORM HIDDEN AT FIRST */

            opacity: 0;
            visibility: hidden;

            transition: opacity 1s ease;
        }


        /* FORM APPEARS AFTER WELCOME */

        .form.show-form {
            opacity: 1;
            visibility: visible;
        }


        /* ========================= */
        /* Form */
        /* ========================= */

        .form form {
            display: grid;

            grid-template-columns: 150px 1fr;

            row-gap: 20px;

            font-weight: bold;
        }


        /* ========================= */
        /* Inputs */
        /* ========================= */

        .form input {
            width: 100%;

            border-radius: 10px;
            border: 1px solid gray;

            padding: 8px 10px;

            font-size: 15px;
        }


        /* ========================= */
        /* Submit button */
        /* ========================= */

        .form .submit-btn {
            grid-column: 1 / -1;
            justify-self: center;

            width: auto;

            padding: 10px 25px;

            border-radius: 25px;

            cursor: pointer;
        }


        /* ========================= */
        /* MOBILE */
        /* ========================= */

        @media (max-width: 600px) {


            /* Welcome intro mobile */

            .welcome-cat {
                font-size: 70px;
            }


            .welcome-intro h2 {
                font-size: 28px;
            }


            .welcome-intro p {
                font-size: 16px;

                padding: 0 20px;
            }


            /* Existing heading */

            .background h1 {

                top: 5%;

                width: 85%;

                font-size: 25px;

                white-space: normal;

                padding: 10px 15px;
            }


            /* Existing form */

            .form {

                top: 140px;

                width: 90%;

                max-width: 380px;

                padding: 30px 20px;

                border-radius: 30px;
            }


            .form form {

                grid-template-columns: 1fr;

                row-gap: 10px;
            }


            .form label {

                margin-top: 8px;
            }


            .form input {

                width: 100%;

                padding: 10px;

                font-size: 16px;
            }


            .form .submit-btn {

                margin-top: 10px;

                padding: 12px 25px;

                font-size: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- FIRST: WELCOME PAGE -->
    <!-- ========================= -->

    <div class="welcome-intro" id="welcomeIntro">

        <div class="welcome-cat">
            🐱
        </div>

        <h2>
            Hii Cutie! 💕
        </h2>

        <p>
            Welcome to your little surprise! ✨<br>
            I have something special waiting for you... 🥰
        </p>

    </div>


    <!-- ========================= -->
    <!-- SECOND: YOUR FORM PAGE -->
    <!-- ========================= -->

    <div class="background">

        <img src="airtel.jpeg"
             alt="hearts">


        <h1>
            Tell Me About You 💞
        </h1>


        <div class="form">

            <form action="/save-details" method="POST">

    <label>Name:</label>

    <input
        type="text"
        name="name"
        placeholder="Enter Your Name"
        required
    >

    <label>Nick Name:</label>

    <input
        type="text"
        name="nickname"
        placeholder="Enter Your Nick Name"
        required
    >

    <label>Date Of Birth:</label>

    <input
        type="date"
        name="dob"
        required
    >

    <label>Favourite Colour:</label>

    <input
        type="text"
        name="favouriteColour"
        placeholder="Colour"
        required
    >

    <label>My Favourite Colour:</label>

    <input
        type="text"
        name="myFavouriteColour"
        placeholder="Colour"
        required
    >

    <input
        type="submit"
        class="submit-btn"
        value="Begin the Surprise ❤️"
    >

</form>

        </div>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>

        /* Welcome stays for 3 seconds */

        setTimeout(function() {

            /* Start hiding welcome page */

            document
                .getElementById("welcomeIntro")
                .classList.add("welcome-hide");


            /* Wait for the 1-second fade animation */

            setTimeout(function() {

                /* Show the form */

                document
                    .querySelector(".form")
                    .classList.add("show-form");

            }, 1000);


        }, 3000);

    </script>


</body>

</html>
